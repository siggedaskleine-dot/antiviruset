name: Bygg och testa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Bygg
        run: dotnet build --configuration Release

      - name: Testa
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Paketera kommandoradsprogrammet
        run: dotnet publish src/MattesAntivirus.Cli --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Provkör
        run: |
          publish/mattes-av.exe info
          publish/mattes-av.exe scan signatures rules

      - name: Paketera programmet
        run: dotnet publish src/MattesAntivirus.App --configuration Release --runtime win-x64 --self-contained false --output publish-app

      - name: Starta programmet och kontrollera startsidan
        run: |
          $process = Start-Process -FilePath publish-app/MattesAntivirus.exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Programmet stängdes direkt (kod $($process.ExitCode))" }
          $process.Refresh()

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("screenshot.png")

          # List every text in the window so the log shows what the overview page displays.
          $window = [System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
          $texts = $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) |
            ForEach-Object { $_.Current.Name } | Where-Object { $_ } | Select-Object -Unique
          Write-Host "Fönstertitel: $($process.MainWindowTitle)"
          $texts | ForEach-Object { Write-Host "  $_" }
          Stop-Process -Id $process.Id

          foreach ($expected in "Översikt", "Snabbskanning", "Fullständig skanning", "Anpassad skanning", "Karantän") {
            if ($texts -notcontains $expected) { throw "Startsidan saknar texten '$expected'" }
          }
          if ($texts | Where-Object { $_ -like "*oväntat fel*" }) { throw "Programmet visade ett felmeddelande" }

      - uses: actions/upload-artifact@v4
        with:
          name: mattes-av-win-x64
          path: publish

      - uses: actions/upload-artifact@v4
        with:
          name: mattes-antivirus-win-x64
          path: publish-app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarmbild
          path: screenshot.png
          if-no-files-found: ignore
